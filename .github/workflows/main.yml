name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Auto-structure Project and Build
        run: |
          # 1. Create a clean Flutter template
          flutter create temp_app --platforms=android
          
          # 2. Move lib files if main.dart exists in root
          if [ -f main.dart ]; then
            cp main.dart temp_app/lib/
          fi
          
          # 3. Copy pubspec if exists
          if [ -f pubspec.yaml ]; then
            cp pubspec.yaml temp_app/
          fi
          
          # 4. Build APK inside temp_app
          cd temp_app
          flutter pub get || true
          flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: temp_app/build/app/outputs/flutter-apk/app-debug.apk
